syntax = "proto3";
package order;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (Order);
  rpc FindOne (FindOneOrderRequest) returns (Order);
  rpc FindAll (FindAllOrdersRequest) returns (OrderList);
  rpc FindAllByUser (FindAllByUserRequest) returns (OrderList);
}

message CreateOrderRequest {
  string productId = 1;
  int32 quantity = 2;
  string userId = 3;
  string address = 4;
  string phone = 5;
}

message FindOneOrderRequest {
  string id = 1;
}

message FindAllOrdersRequest {
  int32 page = 1;
  int32 limit = 2;
}

message FindAllByUserRequest {
  string userId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message Order {
  string id = 1;
  string productId = 2;
  int32 quantity = 3;
  double totalPrice = 4;
  string orderStatus = 5;
  string createdAt = 6;
  string userId = 7;
  string address = 8;
  string phone = 9;
}

message OrderList {
  repeated Order orders = 1;
  int32 total = 2;
}
