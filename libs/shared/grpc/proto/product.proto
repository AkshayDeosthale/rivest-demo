syntax = "proto3";
package product;

service ProductService {
  rpc FindOne (FindOneRequest) returns (Product);
  rpc FindAll (FindAllRequest) returns (ProductList);
  rpc Create (CreateProductRequest) returns (Product);
  rpc Update (UpdateProductRequest) returns (Product);
  rpc Delete (DeleteProductRequest) returns (Product);
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc UpdateStock (UpdateStockRequest) returns (Product);
}

message FindOneRequest {
  string id = 1;
}

message FindAllRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
  string sortBy = 4;
  string sortOrder = 5;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 stock = 4;
  string category = 5;
  string image = 6;
}

message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  string category = 6;
  string image = 7;
}

message DeleteProductRequest {
  string id = 1;
}

message CheckStockRequest {
  string productId = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
  bool available = 5;
}

message UpdateStockRequest {
  string productId = 1;
  int32 delta = 2;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  string category = 6;
  string createdAt = 7;
  string updatedAt = 8;
  string image = 9;
}

message ProductList {
  repeated Product products = 1;
  int32 total = 2;
}
